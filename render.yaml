services:
  # ========================
  # Backend Service
  # ========================
  - type: web
    name: pawmate-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production

      # Frontend Host + Port (instead of URL)
      - key: FRONTEND_HOSTPORT
        fromService:
          type: web
          name: pawmate-frontend
          property: hostport

      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ========================
  # Frontend Service
  # ========================
  - type: web
    name: pawmate-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend Host + Port (instead of URL)
      - key: VITE_API_HOSTPORT
        fromService:
          type: web
          name: pawmate-backend
          property: hostport
